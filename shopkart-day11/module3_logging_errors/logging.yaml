# Python logging configuration (used with logging.config.dictConfig)
version: 1
disable_existing_loggers: false

formatters:
  simple:
    format: "%(levelname)-8s | %(name)s | %(message)s"
  detailed:
    format: "%(asctime)s | %(levelname)-8s | %(name)s | %(filename)s:%(lineno)d | %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: simple
    stream: ext://sys.stdout
  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: logs/shopkart.log      # replaced with full path in code
    maxBytes: 1048576                # 1 MB
    backupCount: 3                   # keep 3 old files
    encoding: utf-8

loggers:
  shopkart:                          # covers shopkart.orders, shopkart.payments ...
    level: DEBUG
    handlers: [console, file]
    propagate: false

root:
  level: WARNING
  handlers: [console]
