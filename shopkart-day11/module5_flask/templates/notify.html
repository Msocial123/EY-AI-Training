{% extends "base.html" %}
{% block content %}
<div class="card">
  <h2>Notify me: {{ product.name }}</h2>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <form method="post">
    <label>Your email</label><br>
    <input type="text" name="email" placeholder="you@example.com" size="30">
    <button type="submit">Notify me</button>
  </form>
</div>
{% endblock %}
