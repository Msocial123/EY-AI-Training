<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ title }} | ShopKart</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; color: #222; }
    header { background: #2b59c3; color: white; padding: 14px 32px; }
    header a { color: white; text-decoration: none; font-size: 22px; font-weight: bold; }
    main { padding: 24px 32px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .card { background: white; border-radius: 8px; padding: 16px; box-shadow: 0 1px 3px #0002; }
    .price { font-size: 20px; font-weight: bold; }
    .mrp { text-decoration: line-through; color: #888; }
    .off { color: #138a36; font-weight: bold; }
    .out { color: #c62828; font-weight: bold; }
    .low { color: #e65100; }
    .ok  { background: #e7f6ec; padding: 10px; border-radius: 6px; }
    .err { color: #c62828; }
    button { background: #ff9f00; border: 0; padding: 10px 16px; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <header><a href="{{ url_for('index') }}">ShopKart</a></header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
